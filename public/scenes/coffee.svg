<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fde9c8"/>
      <stop offset="55%" stop-color="#f6d5a8"/>
      <stop offset="100%" stop-color="#e6b98a"/>
    </linearGradient>
    <linearGradient id="counter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a9713f"/>
      <stop offset="100%" stop-color="#7d4f28"/>
    </linearGradient>
    <radialGradient id="lamp" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff6d8" stop-opacity="0.95"/>
      <stop offset="70%" stop-color="#ffdf9b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffdf9b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#wall)"/>

  <!-- 后方窗格 -->
  <g opacity="0.28" fill="#fff8e7">
    <rect x="60" y="120" width="180" height="260" rx="10"/>
    <rect x="560" y="120" width="180" height="260" rx="10"/>
  </g>
  <g opacity="0.35" stroke="#b7824f" stroke-width="6" fill="none">
    <rect x="60" y="120" width="180" height="260" rx="10"/>
    <rect x="560" y="120" width="180" height="260" rx="10"/>
    <line x1="150" y1="120" x2="150" y2="380"/>
    <line x1="650" y1="120" x2="650" y2="380"/>
  </g>

  <!-- 吊灯 -->
  <g>
    <line x1="250" y1="0" x2="250" y2="120" stroke="#8a5a30" stroke-width="5"/>
    <path d="M215 120 Q250 170 285 120 Z" fill="#8a5a30"/>
    <circle cx="250" cy="185" r="95" fill="url(#lamp)"/>
    <circle cx="250" cy="128" r="13" fill="#fff2c9"/>
  </g>
  <g>
    <line x1="550" y1="0" x2="550" y2="160" stroke="#8a5a30" stroke-width="5"/>
    <path d="M515 160 Q550 210 585 160 Z" fill="#8a5a30"/>
    <circle cx="550" cy="225" r="95" fill="url(#lamp)"/>
    <circle cx="550" cy="168" r="13" fill="#fff2c9"/>
  </g>

  <!-- 吧台 -->
  <rect x="0" y="640" width="800" height="360" fill="url(#counter)"/>
  <rect x="0" y="620" width="800" height="34" rx="8" fill="#c98b52"/>

  <!-- 吧台上的杯子 -->
  <g fill="#f3e3cd">
    <path d="M300 545 h80 a12 12 0 0 1 12 12 v40 a26 26 0 0 1 -26 26 h-52 a26 26 0 0 1 -26 -26 v-40 a12 12 0 0 1 12 -12 z"/>
    <path d="M392 560 h20 a20 20 0 0 1 0 40 h-20 z" opacity="0.85"/>
    <ellipse cx="340" cy="545" rx="40" ry="10" fill="#8b5a2b"/>
  </g>
  <g fill="#f3e3cd" opacity="0.9">
    <path d="M520 555 h66 a10 10 0 0 1 10 10 v34 a22 22 0 0 1 -22 22 h-42 a22 22 0 0 1 -22 -22 v-34 a10 10 0 0 1 10 -10 z"/>
  </g>

  <!-- 热气 -->
  <g stroke="#fff7e6" stroke-width="6" fill="none" opacity="0.5" stroke-linecap="round">
    <path d="M330 500 q-14 -26 0 -48 q14 -22 0 -44"/>
    <path d="M356 505 q-14 -24 0 -44 q14 -20 0 -40"/>
  </g>

  <!-- 散景 -->
  <g fill="#fff3d0" opacity="0.45">
    <circle cx="120" cy="470" r="16"/>
    <circle cx="710" cy="520" r="22"/>
    <circle cx="90" cy="560" r="10"/>
    <circle cx="640" cy="430" r="12"/>
  </g>
</svg>
