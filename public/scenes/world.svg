<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glowEurope" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B45309" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#B45309" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAsia" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowAmerica" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0F766E" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0F766E" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="560" fill="#14110F"/>

  <!-- 经纬网格 -->
  <g stroke="#2A2521" stroke-width="1">
    <line x1="0" y1="80" x2="1000" y2="80"/>
    <line x1="0" y1="160" x2="1000" y2="160"/>
    <line x1="0" y1="240" x2="1000" y2="240"/>
    <line x1="0" y1="320" x2="1000" y2="320"/>
    <line x1="0" y1="400" x2="1000" y2="400"/>
    <line x1="0" y1="480" x2="1000" y2="480"/>
    <line x1="125" y1="0" x2="125" y2="560"/>
    <line x1="250" y1="0" x2="250" y2="560"/>
    <line x1="375" y1="0" x2="375" y2="560"/>
    <line x1="500" y1="0" x2="500" y2="560"/>
    <line x1="625" y1="0" x2="625" y2="560"/>
    <line x1="750" y1="0" x2="750" y2="560"/>
    <line x1="875" y1="0" x2="875" y2="560"/>
  </g>

  <!-- 区域光晕（示意大陆所在，不画边界） -->
  <ellipse cx="290" cy="230" rx="150" ry="170" fill="url(#glowAmerica)"/>
  <ellipse cx="520" cy="230" rx="120" ry="180" fill="url(#glowEurope)"/>
  <ellipse cx="760" cy="190" rx="180" ry="140" fill="url(#glowAsia)"/>

  <!-- 主要航线 -->
  <g fill="none" stroke="#B45309" stroke-width="1.6" stroke-dasharray="5 7" opacity="0.55">
    <path d="M500 114 C420 150 320 150 294 157"/>
    <path d="M500 114 C540 130 570 170 587 200"/>
    <path d="M500 114 C640 90 780 110 888 177"/>
  </g>

  <!-- 城市节点 -->
  <g>
    <!-- London（已解锁） -->
    <circle cx="500" cy="114" r="26" fill="#B45309" opacity="0.14"/>
    <circle cx="500" cy="114" r="12" fill="#B45309" opacity="0.28"/>
    <circle cx="500" cy="114" r="5" fill="#FBBF24"/>

    <!-- Paris -->
    <circle cx="507" cy="125" r="3.5" fill="#78716C"/>
    <!-- Cairo -->
    <circle cx="587" cy="200" r="3.5" fill="#78716C"/>
    <!-- New York -->
    <circle cx="294" cy="157" r="3.5" fill="#78716C"/>
    <!-- Tokyo -->
    <circle cx="888" cy="177" r="4" fill="#78716C"/>
  </g>

  <!-- 罗盘 -->
  <g opacity="0.5" stroke="#57534E" stroke-width="1.2" fill="none">
    <circle cx="930" cy="490" r="30"/>
    <path d="M930 462 L938 490 L930 518 L922 490 Z" fill="#57534E" stroke="none" opacity="0.7"/>
  </g>
  <text x="930" y="452" fill="#57534E" font-size="10" text-anchor="middle" font-family="Helvetica Neue">N</text>
</svg>
