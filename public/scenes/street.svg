<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0f2"/>
      <stop offset="45%" stop-color="#a8c4e0"/>
      <stop offset="100%" stop-color="#7f9dbd"/>
    </linearGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5f7796"/>
      <stop offset="100%" stop-color="#3f546e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6b7c92"/>
      <stop offset="100%" stop-color="#41505f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffe9b0" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffe9b0" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#sky)"/>

  <!-- 远景楼 -->
  <g fill="url(#bldg)" opacity="0.55">
    <rect x="40" y="300" width="150" height="360" rx="6"/>
    <rect x="230" y="240" width="120" height="420" rx="6"/>
    <rect x="470" y="280" width="160" height="380" rx="6"/>
    <rect x="660" y="330" width="120" height="330" rx="6"/>
  </g>

  <!-- 近景楼 -->
  <g fill="url(#bldg)">
    <rect x="-20" y="180" width="210" height="500" rx="8"/>
    <rect x="620" y="150" width="220" height="530" rx="8"/>
  </g>

  <!-- 窗户 -->
  <g fill="#f2e2b8" opacity="0.75">
    <rect x="30" y="230" width="46" height="62" rx="4"/>
    <rect x="100" y="230" width="46" height="62" rx="4"/>
    <rect x="30" y="330" width="46" height="62" rx="4"/>
    <rect x="100" y="330" width="46" height="62" rx="4"/>
    <rect x="30" y="430" width="46" height="62" rx="4"/>
    <rect x="660" y="210" width="52" height="70" rx="4"/>
    <rect x="740" y="210" width="52" height="70" rx="4"/>
    <rect x="660" y="320" width="52" height="70" rx="4"/>
    <rect x="740" y="320" width="52" height="70" rx="4"/>
    <rect x="660" y="430" width="52" height="70" rx="4"/>
  </g>

  <!-- 路灯 -->
  <g>
    <rect x="392" y="300" width="10" height="420" fill="#33404f"/>
    <path d="M397 300 q-46 0 -46 44" stroke="#33404f" stroke-width="10" fill="none"/>
    <circle cx="351" cy="352" r="14" fill="#ffeeb8"/>
    <circle cx="351" cy="352" r="70" fill="url(#glow)"/>
  </g>

  <!-- 路面 -->
  <rect x="0" y="700" width="800" height="300" fill="url(#road)"/>
  <g stroke="#c9d4e0" stroke-width="8" opacity="0.55" stroke-dasharray="46 40">
    <line x1="400" y1="1000" x2="400" y2="720"/>
  </g>

  <!-- 路面反光 -->
  <g opacity="0.25" fill="#ffe9b0">
    <ellipse cx="351" cy="760" rx="70" ry="26"/>
  </g>

  <!-- 飞鸟 -->
  <g stroke="#5b6f86" stroke-width="4" fill="none" opacity="0.6" stroke-linecap="round">
    <path d="M520 150 q14 -12 28 0 q14 -12 28 0"/>
    <path d="M180 200 q11 -9 22 0 q11 -9 22 0"/>
  </g>
</svg>
